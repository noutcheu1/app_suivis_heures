security:
    password_hashers:
        App\Entity\Horaire\UserSuivi:
            algorithm: bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Horaire\UserSuivi
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator
            logout:
                path: app_logout
                target: app_login

    role_hierarchy:
        ROLE_ADMIN: [ROLE_INTERVENANT, ROLE_FAMILLE]

when@test:
    security:
        password_hashers:
            App\Entity\Horaire\UserSuivi:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
