security:
    password_hashers:
        App\Entity\Horaire\UserSuivi:
            algorithm: bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Horaire\UserSuivi
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator
            logout:
                path: app_logout
                target: app_login
            # Session longue : l'utilisateur (surtout l'intervenant sur mobile) reste
            # connecté ~1 an → il ne se reconnecte presque jamais. Cookie signé
            # (basé sur le hash du mot de passe) → invalidé si le mot de passe change.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 31536000      # 1 an (secondes)
                always_remember_me: true
                samesite: lax

    role_hierarchy:
        ROLE_ADMIN: [ROLE_INTERVENANT, ROLE_FAMILLE]

    access_control:
        - { path: ^/login,                  roles: PUBLIC_ACCESS }
        - { path: ^/logout,                 roles: PUBLIC_ACCESS }
        - { path: ^/register,               roles: PUBLIC_ACCESS }
        - { path: ^/api/register,           roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe-oublie,    roles: PUBLIC_ACCESS }
        # Pointage QR sans connexion (identification par numéro de téléphone).
        # /declarer est public : le contrôleur redirige les non-connectés vers /pointage.
        - { path: ^/declarer,               roles: PUBLIC_ACCESS }
        - { path: ^/pointage,               roles: PUBLIC_ACCESS }
        # /garde : déclaration garde d'enfant sans QR (téléphone → planning → pointage).
        - { path: ^/garde,                  roles: PUBLIC_ACCESS }
        - { path: ^/admin-mvc,              roles: ROLE_ADMIN }
        - { path: ^/familles-mvc,           roles: ROLE_ADMIN }
        - { path: ^/famille/,               roles: ROLE_FAMILLE }
        # Catch-all : REMEMBERED (et non FULLY) pour ne pas casser le cookie
        # « se souvenir de moi » d'1 an un intervenant ré-authentifié par cookie
        # est IS_AUTHENTICATED_REMEMBERED, pas FULLY.
        - { path: ^/,                       roles: IS_AUTHENTICATED_REMEMBERED }

when@test:
    security:
        password_hashers:
            App\Entity\Horaire\UserSuivi:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
