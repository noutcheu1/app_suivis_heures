# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        storage_factory_id: session.storage.factory.native
        cookie_secure: false
        cookie_samesite: lax
        cookie_httponly: true
        cookie_path: /
        # Durée de session explicite (sinon défaut PHP = 24 min d'inactivité → déconnexion
        # « trop rapide »). 30 jours ; au-delà, le remember-me (1 an) prend le relais.
        cookie_lifetime: 2592000   # 30 jours (cookie de session persistant)
        gc_maxlifetime: 2592000    # 30 jours (données de session côté serveur)
    
        # cookie_secure: auto
        # cookie_httponly: auto
        # csamesite: lax
   
    
    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
