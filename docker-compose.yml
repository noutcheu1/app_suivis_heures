services:

  # ─── PHP / Apache / Symfony ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaudoudoux_php
    ports:
      - "8032:80"
    volumes:
      - .:/var/www/html
      - app_var:/var/www/html/var
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-change_me}
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: chaudoudoux
      DB_PASSWORD: root
      DB_NAME_PRINCIPAL: bdchaudoudoux
      DB_NAME_SECONDAIRE: bdchaudoudoux_horaire
      MAILER_DSN: smtp://noreplychaudoudoux@gmail.com:password@smtp.gmail.com:587
    restart: unless-stopped
    networks:
      - chaudoudoux_net

  # ─── MariaDB ───────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: chaudoudoux_mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bdchaudoudoux
      MYSQL_USER: chaudoudoux
      MYSQL_PASSWORD: root
    volumes:
      - ./docker/conf/sql/:/docker-entrypoint-initdb.d/
      - ./docker/conf/dumps/:/dumps/:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chaudoudoux_net

  # ─── Adminer ───────────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: chaudoudoux_adminer
    restart: unless-stopped
    ports:
      - "8033:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - chaudoudoux_net

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  app_var:

# ─── Réseau ────────────────────────────────────────────────────────────────
networks:
  chaudoudoux_net:
    driver: bridge